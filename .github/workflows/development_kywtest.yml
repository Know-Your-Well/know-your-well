# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - kywtest

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'
          include-prerelease: true

      - name: Build with dotnet
        working-directory: ./knowyourwell
        run: dotnet build --configuration Release

      - name: dotnet publish
        working-directory: ./knowyourwell
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'kywtest'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B107C49BF98E4120BB3AEFE95F760912 }}
          package: .

      - name: Verify API endpoints
        shell: pwsh
        run: |
          $baseUrl = "https://kywtest.azurewebsites.net"
          $lastError = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $heartbeat = Invoke-WebRequest -Uri "$baseUrl/heartbeat" -UseBasicParsing -TimeoutSec 20
              $devSession = Invoke-WebRequest -Uri "$baseUrl/createDevSession" -UseBasicParsing -TimeoutSec 20
              if ($heartbeat.StatusCode -eq 200 -and $devSession.StatusCode -eq 200 -and $devSession.Content -match '"success":"success"') {
                Write-Host "Heartbeat and development login endpoints are healthy."
                exit 0
              }
              $lastError = "Unexpected response: heartbeat=$($heartbeat.StatusCode), dev session=$($devSession.StatusCode)."
            }
            catch {
              $lastError = $_.Exception.Message
            }
            Write-Host "API not ready (attempt $attempt/12): $lastError"
            Start-Sleep -Seconds 10
          }
          throw "Deployment did not serve its API endpoints after 12 attempts. Last error: $lastError"
